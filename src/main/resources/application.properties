spring.application.name=v1

# PostgreSQL (local)
spring.datasource.url=jdbc:postgresql://localhost:5432/coldmailer
spring.datasource.username=postgres
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Redis (local)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=5s

# JWT
# Replace in production with a strong secret loaded from env/secret manager.
app.jwt.secret=change-this-jwt-secret-to-a-long-random-string-32chars-min
app.jwt.expiration-seconds=86400

# CORS (comma-separated frontend origins)
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Tracking links and resume redirect
app.base-url=http://localhost:8080
app.resume-url=https://example.com/resume.pdf
app.resume.storage-dir=uploads/resumes
app.resume.max-bytes=5242880

# Queue and worker
app.queue.email-jobs-key=email:jobs
app.worker.enabled=true
app.worker.poll-delay-ms=250
app.dispatch.min-delay-ms=8000
app.dispatch.max-delay-ms=15000
app.dispatch.max-retries=2

# SMTP circuit breaker
app.smtp.cb.failure-rate-threshold=50
app.smtp.cb.sliding-window-size=20
app.smtp.cb.minimum-number-of-calls=10
app.smtp.cb.wait-duration-open-seconds=30

# CSV import safety limits
app.csv.max-bytes=1048576
app.csv.max-rows=10000

# Actuator
management.endpoints.web.exposure.include=*
